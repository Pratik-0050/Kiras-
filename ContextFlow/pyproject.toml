# pyproject.toml — ContextFlow packaging (Step: professional library)
#
# Build a wheel + sdist with:        python -m build
# Editable development install with: pip install -e ".[dev]"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contextflow"
version = "1.0.0"
description = "Intelligent context management for LLMs: token budgets, compaction, retrieval, agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "ContextFlow Contributors" }]
keywords = ["llm", "context", "compaction", "retrieval", "agents", "tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Hard runtime deps only: tiktoken is imported at module load (message.py);
# python-dotenv is tiny and used for .env loading across components.
# OpenAI + ChromaDB stay optional -- every integration imports them lazily
# and raises a clear error naming the missing extra.
dependencies = [
    "tiktoken>=0.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0.0"]
vector = ["chromadb>=1.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.8.0", "build>=1.0.0"]
all = ["openai>=1.0.0", "chromadb>=1.0.0"]

[project.scripts]
contextflow-demo = "contextflow.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest` run from a fresh clone without installing first; an
# installed (or editable) package resolves to the same source tree.
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# E4/E7/E9 (syntax-adjacent pycodestyle) + F (pyflakes). Formatting is
# intentionally NOT enforced: the repo keeps a consistent hand style
# (aligned imports, section banners) that `ruff format` would churn.
select = ["E4", "E7", "E9", "F"]
